<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | NURA AI Labs</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <nav class="navbar bg-white shadow-sm px-4 py-3">
        <div class="container">
            <span class="navbar-brand fw-bold">
                NURA AI Labs
            </span>

            <button
                class="btn btn-outline-danger btn-sm"
                id="logoutBtn"
            >
                Logout
            </button>
        </div>
    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="auth-card">

                    <div class="text-center mb-4">
                        <h1>Welcome, <span id="profileUsername">User</span> 👋</h1>

                        <p class="text-muted">
                            Your NURA profile
                        </p>
                    </div>

                    <div class="row g-3">

                        <div class="col-md-6">
                            <div class="p-3 bg-light rounded">
                                <small class="text-muted">
                                    Username
                                </small>

                                <h5 id="username" class="mb-0 mt-1">
                                    Loading...
                                </h5>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="p-3 bg-light rounded">
                                <small class="text-muted">
                                    Email
                                </small>

                                <h5 id="email" class="mb-0 mt-1">
                                    Loading...
                                </h5>
                            </div>
                        </div>

                    </div>

                    <hr class="my-4">

                    <div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Profile Information</h5>

        <button
            type="button"
            class="btn btn-sm btn-outline-primary"
            id="editProfileBtn"
        >
            Edit Profile
        </button>
    </div>

    <!-- Profile display -->
    <div id="profileDisplay">

        <div class="row g-3">

            <div class="col-md-6">
                <div class="p-3 bg-light rounded">
                    <small class="text-muted">Full Name</small>
                    <h6 id="fullName" class="mb-0 mt-1">
                        Not provided
                    </h6>
                </div>
            </div>

            <div class="col-md-6">
                <div class="p-3 bg-light rounded">
                    <small class="text-muted">Phone</small>
                    <h6 id="phone" class="mb-0 mt-1">
                        Not provided
                    </h6>
                </div>
            </div>

            <div class="col-md-6">
                <div class="p-3 bg-light rounded">
                    <small class="text-muted">Location</small>
                    <h6 id="location" class="mb-0 mt-1">
                        Not provided
                    </h6>
                </div>
            </div>

            <div class="col-md-6">
                <div class="p-3 bg-light rounded">
                    <small class="text-muted">Bio</small>
                    <h6 id="bio" class="mb-0 mt-1">
                        Not provided
                    </h6>
                </div>
            </div>

        </div>

    </div>

    <!-- Edit form -->
    <form id="editProfileForm" class="d-none mt-3">

        <div class="mb-3">
            <label for="editFullName" class="form-label">
                Full Name
            </label>

            <input
                type="text"
                class="form-control"
                id="editFullName"
                name="full_name"
            >
        </div>

        <div class="mb-3">
            <label for="editPhone" class="form-label">
                Phone
            </label>

            <input
                type="tel"
                class="form-control"
                id="editPhone"
                name="phone"
            >
        </div>

        <div class="mb-3">
            <label for="editLocation" class="form-label">
                Location
            </label>

            <input
                type="text"
                class="form-control"
                id="editLocation"
                name="location"
            >
        </div>

        <div class="mb-3">
            <label for="editBio" class="form-label">
                Bio
            </label>

            <textarea
                class="form-control"
                id="editBio"
                name="bio"
                rows="3"
            ></textarea>
        </div>

        <div id="profileMessage" class="mb-3"></div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Changes
        </button>

        <button
            type="button"
            class="btn btn-secondary"
            id="cancelEditBtn"
        >
            Cancel
        </button>

    </form>
</div>
        </div>

    </div>
</div>

                </div>

            </div>

        </div>

    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="assets/js/profile.js"></script>

</body>
</html>
